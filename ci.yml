name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that's now stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if package.json and pnpm-lock.yaml disagree,
      # instead of silently resolving different versions than you tested locally.
      - run: pnpm install --frozen-lockfile

      # Turbo's local cache, restored between runs: untouched packages replay
      # their previous results instead of re-running.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check
      - run: pnpm turbo run build lint typecheck test --cache-dir=.turbo/cache

      - name: Validate docker-compose.yml
        run: docker compose --profile apps config --quiet

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [template-service]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: seatrush/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
