# SeatRush local infrastructure.
#
#   docker compose up -d --wait            infra only; returns once everything is healthy
#   docker compose --profile apps up -d    infra + containerized services
#   docker compose ps                      health status per container
#   docker compose down                    stop (volumes kept)
#   docker compose down -v                 stop AND delete all data
#
# Networking: compose creates one bridge network for this project. Containers
# reach each other by SERVICE NAME (postgres:5432, redpanda:9092). `ports:`
# only publishes to your host; containers don't need it to talk to each other.
#
# Host ports can be overridden if something on your machine already uses them,
# e.g. in a root .env file:  POSTGRES_HOST_PORT=5433

name: seatrush

# Shared probe timing. start_interval probes quickly during start_period so
# `up --wait` returns as soon as a service is ready instead of waiting a full interval.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
  start_interval: 1s

services:
  # --------------------------------------------------------------------------
  postgres:
    # Official postgres image + the pgvector extension (assistant, Phase 5).
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_USER: seatrush
      POSTGRES_PASSWORD: seatrush
      POSTGRES_DB: seatrush
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent dir (not .../data like PG ≤ 17).
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      # -h 127.0.0.1 forces TCP. During first-boot init, the entrypoint runs a
      # TEMPORARY server that listens on the unix socket only. Plain pg_isready
      # (socket) says "ready" then, and the server restarts right after.
      # Probing TCP only succeeds against the real, final server.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U seatrush -d seatrush']

  # --------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    # Single-node REPLICA SET, not standalone: Mongo transactions (and change
    # streams) require one. Catalog needs transactions once it uses an outbox.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      <<: *healthcheck
      # Initiates the replica set on first boot, then only reports healthy
      # once this node has been elected PRIMARY (writable).
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) quit(1)

  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      # grep PONG: while loading data from disk Redis answers "-LOADING ...",
      # and redis-cli can still exit 0 on an error reply.
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']

  # --------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    # TWO listeners, because Kafka clients don't keep using the address you give them.
    # The bootstrap call returns the broker's ADVERTISED address and the client
    # reconnects to THAT. So each audience needs an address it can resolve:
    #   internal://redpanda:9092    → other containers
    #   external://localhost:19092  → your host (pnpm dev, tests, scripts)
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
    ports:
      - '19092:19092' # Kafka API (host listener)
      - '18081:18081' # Schema Registry
      - '18082:18082' # HTTP Proxy
      - '19644:9644' # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    environment:
      CONFIG_FILEPATH: /etc/console/config.yml
    volumes:
      - ./infra/redpanda/console.yml:/etc/console/config.yml:ro
    ports:
      - '${CONSOLE_HOST_PORT:-8080}:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']

  # --------------------------------------------------------------------------
  jaeger:
    # v2 all-in-one: OTLP in, trace UI out. Wired up in Phase 6.
    image: jaegertracing/jaeger:2.21.0
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:13133/status || exit 1']

  # --------------------------------------------------------------------------
  # Services. Behind a profile so plain `docker compose up` = infra only and
  # you run services on the host with `pnpm dev`. Copy this block per service.
  template-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: template-service
    # tini as PID 1: forwards SIGTERM to node and reaps zombie processes.
    init: true
    environment:
      NODE_ENV: production
      SERVICE_NAME: template-service
      PORT: 3000
      LOG_LEVEL: info
      # `postgres`, not `localhost`: inside a container, localhost is the container itself.
      DATABASE_URL: postgres://seatrush:seatrush@postgres:5432/seatrush
      DB_CONNECT_MAX_ATTEMPTS: 10
      SHUTDOWN_TIMEOUT_MS: 8000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        # Wait for the healthcheck to PASS, not just for the container to start.
        condition: service_healthy
    # SIGTERM → wait this long → SIGKILL. Must exceed SHUTDOWN_TIMEOUT_MS.
    stop_grace_period: 10s
    healthcheck:
      <<: *healthcheck
      # Readiness, not liveness: compose uses this to gate dependents.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1']

volumes:
  pg-data:
  mongo-data:
  redis-data:
  redpanda-data:
